<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背單字 App - AI 智慧多語言版</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Dictionary_icon.svg/512px-Dictionary_icon.svg.png">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
    body { margin: 0; padding: 15px; background-color: #f8f9fa; color: #333; }
    .status-bar { padding: 10px; font-size: 14px; background: #d4edda; color: #155724; text-align: center; font-weight: bold; margin-bottom: 15px; border-radius: 8px; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
    h2 { margin-top: 0; font-size: 18px; color: #1a73e8; }
    h3 { font-size: 16px; color: #495057; border-bottom: 2px solid #e9ecef; padding-bottom: 5px; margin-top: 20px;}
    input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
    button { background-color: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .btn-danger { background-color: #dc3545; }
    .btn-secondary { background-color: #6c757d; }
    .btn-success { background-color: #28a745; }
    .btn-warning { background-color: #ffc107; color: #333; }
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .nav { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
    .nav button { flex: 1; background-color: #e9ecef; color: #495057; margin: 0; font-size: 14px; padding: 10px 5px; }
    .nav button.active { background-color: #1a73e8; color: white; }
    .hidden { display: none; }
    .deck-header { display: flex; gap: 8px; margin-bottom: 15px; }
    .setting-group { margin-bottom: 15px; }
    .setting-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #555; }
    .stats-box { background: #f1f3f5; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .stats-box p { margin: 5px 0; font-weight: bold; display: flex; justify-content: space-between; }
    .text-green { color: #28a745; }
    .text-red { color: #dc3545; }
    .row-group { display: flex; gap: 8px; }
    .row-group > * { flex: 1; }
  </style>
</head>
<body>

  <div id="sw-status" class="status-bar">✅ App 已就緒！資料 100% 存於手機本機</div>

  <!-- 分頁導覽 -->
  <div class="nav">
    <button id="tab-list" class="active" onclick="switchTab('list')">📚 單字庫</button>
    <button id="tab-quiz" onclick="switchTab('quiz')">✍️ 測驗</button>
    <button id="tab-stats" onclick="switchTab('stats')">📊 統計</button>
    <button id="tab-ai" onclick="switchTab('ai')">📸 AI 拍照</button>
    <button id="tab-settings" onclick="switchTab('settings')">⚙️ 設定</button>
  </div>

  <!-- 1. 單字庫管理頁面 -->
  <div id="page-list" class="card">
    <h2>📁 選擇單字庫</h2>
    <div class="deck-header">
      <select id="deck-select" onchange="changeCurrentDeck()"></select>
    </div>
    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
      <input type="text" id="new-deck-name" placeholder="新單字庫名稱" style="margin-top:0;">
      <button onclick="createDeck()" style="width: auto; margin-top:0; white-space: nowrap;">新增</button>
    </div>

    <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">

    <h2>➕ 新增單字至「<span id="current-deck-title"></span>」</h2>
    <div class="row-group">
      <div>
        <label style="font-size:12px; color:#666;">題目語言</label>
        <select id="input-q-lang" onchange="saveLanguagePreferences()">
          <option value="en-US">英文 (English)</option>
          <option value="ja-JP">日文 (日本語)</option>
          <option value="zh-TW">中文 (繁體)</option>
          <option value="ko-KR">韓文 (한국어)</option>
          <option value="es-ES">西班牙文</option>
        </select>
      </div>
      <div>
        <label style="font-size:12px; color:#666;">答案語言</label>
        <select id="input-a-lang" onchange="saveLanguagePreferences()">
          <option value="zh-TW">中文 (繁體)</option>
          <option value="ja-JP">日文 (日本語)</option>
          <option value="en-US">英文 (English)</option>
          <option value="ko-KR">韓文 (한국어)</option>
        </select>
      </div>
    </div>

    <input type="text" id="input-question" placeholder="題目 (例如: 食べる)" onblur="aiSuggestAnswer()">
    <div style="display: flex; gap: 5px;">
      <button type="button" class="btn-warning" style="font-size: 12px; padding: 6px; width: auto;" onclick="aiSuggestAnswer()">✨ AI 智慧建議答案</button>
    </div>

    <input type="text" id="input-ans1" placeholder="答案一 (主要，例如: たべる)">
    <input type="text" id="input-ans2" placeholder="答案二 (備用/同義，例如: 吃)">
    <button onclick="addWord()" class="btn-success">加入此單字庫</button>

    <h2 style="margin-top: 20px;">📖 單字清單 (<span id="word-count">0</span>)</h2>
    <div id="word-list"></div>
  </div>

  <!-- 2. 測驗頁面 -->
  <div id="page-quiz" class="card hidden">
    <h2>✍️ 拼寫測驗</h2>
    <select id="quiz-deck-select" style="margin-bottom: 10px;"></select>
    <button onclick="initQuizSession()" class="btn-secondary" style="margin-bottom: 15px;">開始新測驗</button>

    <div id="quiz-box" style="border-top: 1px solid #eee; padding-top: 15px;">
      <p style="font-size: 14px; color: #666; margin-bottom: 5px;" id="quiz-progress"></p>
      <p style="font-size: 22px; font-weight: bold; color: #1a73e8;" id="quiz-prompt">請點擊上方按鈕開始！</p>
      <button type="button" style="width: auto; padding: 6px 12px; font-size: 12px; margin-bottom: 10px;" onclick="speakCurrentQuestion()">🔊 播放題目語音</button>
      <input type="text" id="quiz-answer" placeholder="請輸入對應答案..." autocomplete="off">
      <button id="btn-submit-ans" onclick="checkAnswer()">提交答案</button>
      <p id="quiz-result" style="font-weight: bold; margin-top: 10px;"></p>
    </div>
  </div>

  <!-- 3. 統計頁面 -->
  <div id="page-stats" class="card hidden">
    <h2>📊 學習數據分析</h2>
    <select id="stats-deck-select" style="margin-bottom: 15px;" onchange="renderStats()"></select>
    
    <div class="stats-box">
      <p>📈 歷史通過率 <span id="stat-all-time">--</span></p>
      <p>📅 近一個月通過率 <span id="stat-month">--</span></p>
    </div>

    <h3>⚠️ 單字錯誤率排行 (由高到低)</h3>
    <div id="stats-word-list"></div>
  </div>

  <!-- 4. AI 拍照辨識頁面 -->
  <div id="page-ai" class="card hidden">
    <h2>📸 Gemini 智慧相機辨識</h2>
    <p style="font-size: 14px; color: #666;">拍攝課本或筆記照片，AI 將自動辨識內容並解析為單字加入目前單字庫！</p>
    
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="margin-bottom: 15px;" onchange="handleImageCapture(event)">
    
    <div id="ai-loading" class="hidden" style="text-align: center; color: #1a73e8; font-weight: bold; padding: 20px;">
      ⏳ AI 正在努力辨識圖片與整理單字中，請稍候...
    </div>

    <div id="ai-result-area" class="hidden">
      <h3>🔍 AI 解讀出的原始文字：</h3>
      <textarea id="ai-raw-text" rows="4" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ccc;"></textarea>

      <h3 style="margin-top:15px;">📋 解析出的單字預覽：</h3>
      <div id="ai-parsed-preview" style="background:#f1f3f5; padding:10px; border-radius:8px; margin-bottom:15px; max-height:200px; overflow-y:auto;"></div>

      <button onclick="confirmImportAiWords()" class="btn-success">確認並批量加入單字庫</button>
    </div>
  </div>

  <!-- 5. 設定頁面 -->
  <div id="page-settings" class="card hidden">
    <h2>⚙️ 偏好與 API 設定</h2>
    
    <div class="setting-group">
      <label>🎯 每次測驗題數</label>
      <select id="setting-quiz-limit" onchange="saveSettings()">
        <option value="5">5 題</option>
        <option value="10" selected>10 題</option>
        <option value="20">20 題</option>
        <option value="30">30 題</option>
        <option value="0">全部單字集</option>
      </select>
    </div>

    <div class="setting-group">
      <label>🔑 Gemini API Key</label>
      <input type="password" id="input-api-key" placeholder="貼上你的 API Key" oninput="saveSettings()">
      <button type="button" class="btn-secondary" style="margin-top: 8px;" onclick="testGeminiConnection()">🧪 測試 Gemini 連線狀態</button>
      <p id="test-result" style="font-size: 14px; margin-top: 8px; font-weight: bold;"></p>
    </div>
  </div>

  <!-- 編輯單字彈窗 -->
  <div id="edit-modal" class="card hidden" style="border: 2px solid #1a73e8; position: fixed; top: 10%; left: 5%; right: 5%; z-index: 999; background: white;">
    <h2>✏️ 編輯單字</h2>
    <input type="hidden" id="edit-index">
    <label>題目語言 / 題目</label>
    <div class="row-group">
      <select id="edit-q-lang"><option value="en-US">英文</option><option value="ja-JP">日文</option><option value="zh-TW">中文</option><option value="ko-KR">韓文</option></select>
      <input type="text" id="edit-question" style="margin-top:0;">
    </div>
    <label style="margin-top:10px; display:block;">答案一 / 答案二</label>
    <input type="text" id="edit-ans1" placeholder="答案一">
    <input type="text" id="edit-ans2" placeholder="答案二">
    <div style="display:flex; gap:10px; margin-top:15px;">
      <button onclick="saveEditedWord()" class="btn-success">儲存修改</button>
      <button onclick="closeEditModal()" class="btn-secondary">取消</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    const GEMINI_MODEL = 'gemini-3.6-flash';

    let decks = JSON.parse(localStorage.getItem('vocab_decks') || JSON.stringify([{ id: 'default_1', name: '預設單字庫', words: [], history: [] }]));
    let currentDeckId = localStorage.getItem('vocab_current_deck') || decks[0].id;
    let quizLimit = parseInt(localStorage.getItem('vocab_quiz_limit') || '10');

    let quizQueue = [], currentQuizItem = null;
    let sessionResults = [], totalAnswered = 0, targetLimit = 10;
    let tempParsedAiWords = [];

    window.onload = function() {
      loadLanguagePreferences();
      renderUI();
    };

    function saveData() {
      localStorage.setItem('vocab_decks', JSON.stringify(decks));
      localStorage.setItem('vocab_current_deck', currentDeckId);
      renderUI();
    }

    function saveSettings() {
      quizLimit = parseInt(document.getElementById('setting-quiz-limit').value);
      localStorage.setItem('vocab_quiz_limit', quizLimit);
      localStorage.setItem('gemini_api_key', document.getElementById('input-api-key').value.trim());
    }

    /* 儲存與讀取語言選單偏好 */
    function saveLanguagePreferences() {
      const qLang = document.getElementById('input-q-lang').value;
      const aLang = document.getElementById('input-a-lang').value;
      localStorage.setItem('vocab_q_lang', qLang);
      localStorage.setItem('vocab_a_lang', aLang);
    }

    function loadLanguagePreferences() {
      const savedQLang = localStorage.getItem('vocab_q_lang');
      const savedALang = localStorage.getItem('vocab_a_lang');
      if (savedQLang) document.getElementById('input-q-lang').value = savedQLang;
      if (savedALang) document.getElementById('input-a-lang').value = savedALang;
    }

    function getCurrentDeck() { return decks.find(d => d.id === currentDeckId) || decks[0]; }

    function createDeck() {
      const name = document.getElementById('new-deck-name').value.trim();
      if (!name) return alert('請輸入單字庫名稱！');
      decks.push({ id: 'deck_' + Date.now(), name: name, words: [], history: [] });
      currentDeckId = decks[decks.length - 1].id;
      document.getElementById('new-deck-name').value = '';
      saveData();
    }

    function changeCurrentDeck() {
      currentDeckId = document.getElementById('deck-select').value;
      saveData();
    }

    function addWord() {
      const q = document.getElementById('input-question').value.trim();
      const a1 = document.getElementById('input-ans1').value.trim();
      const a2 = document.getElementById('input-ans2').value.trim();
      const qLang = document.getElementById('input-q-lang').value;
      const aLang = document.getElementById('input-a-lang').value;

      if (!q || !a1) return alert('請至少填寫題目與答案一！');
      const deck = getCurrentDeck();
      deck.words.push({ question: q, ans1: a1, ans2: a2, qLang: qLang, aLang: aLang, attempts: 0, errors: 0 });
      
      document.getElementById('input-question').value = '';
      document.getElementById('input-ans1').value = '';
      document.getElementById('input-ans2').value = '';
      saveData();
    }

    function deleteWord(index) { getCurrentDeck().words.splice(index, 1); saveData(); }

    function openEditModal(index) {
      const w = getCurrentDeck().words[index];
      document.getElementById('edit-index').value = index;
      document.getElementById('edit-question').value = w.question;
      document.getElementById('edit-ans1').value = w.ans1;
      document.getElementById('edit-ans2').value = w.ans2 || '';
      if(w.qLang) document.getElementById('edit-q-lang').value = w.qLang;
      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    function saveEditedWord() {
      const idx = document.getElementById('edit-index').value;
      const w = getCurrentDeck().words[idx];
      w.question = document.getElementById('edit-question').value.trim();
      w.ans1 = document.getElementById('edit-ans1').value.trim();
      w.ans2 = document.getElementById('edit-ans2').value.trim();
      w.qLang = document.getElementById('edit-q-lang').value;
      saveData();
      closeEditModal();
    }

    function speakText(text, lang = 'en-US') {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      window.speechSynthesis.speak(u);
    }

    function speakCurrentQuestion() {
      if (currentQuizItem) {
        speakText(currentQuizItem.question, currentQuizItem.qLang || 'en-US');
      }
    }

    /* 測試 Gemini API 連線是否正常 */
    async function testGeminiConnection() {
      const apiKey = document.getElementById('input-api-key').value.trim();
      const resElem = document.getElementById('test-result');
      
      if (!apiKey) {
        resElem.style.color = 'red';
        resElem.innerText = '❌ 請先輸入 API Key！';
        return;
      }

      resElem.style.color = '#1a73e8';
      resElem.innerText = '⏳ 正在測試連線中...';

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: '請回覆「OK」' }] }]
          })
        });

        const data = await resp.json();
        
        if (data.error) {
          resElem.style.color = 'red';
          resElem.innerText = `❌ 連線失敗：${data.error.message}`;
        } else {
          resElem.style.color = 'green';
          resElem.innerText = '✅ API Key 連線成功！AI 功能已完全生效。';
        }
      } catch (e) {
        resElem.style.color = 'red';
        resElem.innerText = `❌ 網路或請求異常：${e.message}`;
      }
    }

    /* AI 智慧建議答案（已整合目標答案語言設定） */
    async function aiSuggestAnswer() {
      const apiKey = localStorage.getItem('gemini_api_key');
      const q = document.getElementById('input-question').value.trim();
      const qLang = document.getElementById('input-q-lang').value;
      const aLang = document.getElementById('input-a-lang').value;
      if (!apiKey || !q) return;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `請針對題目 "${q}" (題目語言類型: ${qLang})，給出對應翻譯或解釋，答案的語言必須是 "${aLang}"。請嚴格回傳 JSON 格式：{"ans1": "主要答案", "ans2": "備用答案或同義詞"}` }] }]
          })
        });
        const data = await response.json();
        if (data.error) {
          console.log('AI API 錯誤:', data.error.message);
          return;
        }
        const text = data.candidates[0].content.parts[0].text;
        const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleaned);
        if (parsed.ans1) document.getElementById('input-ans1').value = parsed.ans1;
        if (parsed.ans2) document.getElementById('input-ans2').value = parsed.ans2;
      } catch (e) {
        console.log('AI 建議失敗', e);
      }
    }

    /* AI 相機辨識 */
    async function handleImageCapture(event) {
      const file = event.target.files[0];
      if (!file) return;
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) return alert('請先至設定頁面填寫 Gemini API Key！');

      document.getElementById('ai-loading').classList.remove('hidden');
      document.getElementById('ai-result-area').classList.add('hidden');

      const reader = new FileReader();
      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'x-goog-api-key': apiKey
            },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "請先讀出圖片中的所有文字(OCR)，然後將其整理成單字清單。必須回傳 JSON 格式：\n{\n  \"raw_text\": \"圖片原始文字\",\n  \"words\": [\n    {\"question\": \"題目\", \"ans1\": \"答案1\", \"ans2\": \"答案2\", \"qLang\": \"en-US\", \"aLang\": \"zh-TW\"}\n  ]\n}" },
                  { inline_data: { mime_type: file.type, data: base64Data } }
                ]
              }]
            })
          });
          const data = await response.json();
          if (data.error) {
            document.getElementById('ai-loading').classList.add('hidden');
            return alert('AI 辨識錯誤: ' + data.error.message);
          }
          const text = data.candidates[0].content.parts[0].text;
          const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
          const parsed = JSON.parse(cleaned);

          document.getElementById('ai-raw-text').value = parsed.raw_text || '';
          tempParsedAiWords = parsed.words || [];

          document.getElementById('ai-parsed-preview').innerHTML = tempParsedAiWords.map(w => `
            <div style="padding:5px 0; border-bottom:1px solid #ddd;">
              <strong>${w.question}</strong> ➔ ${w.ans1} ${w.ans2 ? '(' + w.ans2 + ')' : ''}
            </div>
          `).join('');

          document.getElementById('ai-loading').classList.add('hidden');
          document.getElementById('ai-result-area').classList.remove('hidden');
        } catch (e) {
          document.getElementById('ai-loading').classList.add('hidden');
          alert('AI 辨識失敗，請確認 API Key 或圖片清晰度。');
        }
      };
      reader.readAsDataURL(file);
    }

    function confirmImportAiWords() {
      if (tempParsedAiWords.length === 0) return alert('沒有可匯入的單字！');
      const deck = getCurrentDeck();
      tempParsedAiWords.forEach(w => {
        deck.words.push({ question: w.question, ans1: w.ans1, ans2: w.ans2 || '', qLang: w.qLang || 'en-US', aLang: w.aLang || 'zh-TW', attempts: 0, errors: 0 });
      });
      saveData();
      alert(`成功匯入 ${tempParsedAiWords.length} 個單字至「${deck.name}」！`);
      switchTab('list');
    }

    function renderUI() {
      const deckSelect = document.getElementById('deck-select');
      const quizDeckSelect = document.getElementById('quiz-deck-select');
      const statsDeckSelect = document.getElementById('stats-deck-select');
      
      const deckOptions = decks.map(d => `<option value="${d.id}" ${d.id === currentDeckId ? 'selected' : ''}>${d.name} (${d.words.length}字)</option>`).join('');
      deckSelect.innerHTML = deckOptions;
      
      const allOption = `<option value="all">🌟 全部單字庫綜合</option>`;
      quizDeckSelect.innerHTML = allOption + decks.map(d => `<option value="${d.id}">📁 ${d.name} (${d.words.length}字)</option>`).join('');
      statsDeckSelect.innerHTML = allOption + decks.map(d => `<option value="${d.id}">📁 ${d.name}</option>`).join('');

      const deck = getCurrentDeck();
      document.getElementById('current-deck-title').innerText = deck.name;
      document.getElementById('word-count').innerText = deck.words.length;
      document.getElementById('word-list').innerHTML = deck.words.length === 0 
        ? '<p style="color:#888;">此單字庫目前沒有單字。</p>'
        : deck.words.map((item, index) => `
          <div class="word-item">
            <div>
              <strong>${item.question}</strong> <span style="color:#666;">(${item.ans1}${item.ans2 ? ' / ' + item.ans2 : ''})</span>
            </div>
            <div>
              <button style="width:auto; padding:5px; margin:0;" onclick="openEditModal(${index})">編輯</button>
              <button class="btn-danger" style="width:auto; padding:5px; margin:0;" onclick="deleteWord(${index})">刪除</button>
            </div>
          </div>
        `).join('');

      document.getElementById('setting-quiz-limit').value = quizLimit;
      if (localStorage.getItem('gemini_api_key')) document.getElementById('input-api-key').value = localStorage.getItem('gemini_api_key');
    }

    function switchTab(tab) {
      ['list', 'quiz', 'stats', 'ai', 'settings'].forEach(t => {
        document.getElementById(`page-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).classList.remove('active');
      });
      document.getElementById(`page-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).classList.add('active');
      if (tab === 'stats') renderStats();
    }

    /* 測驗邏輯 */
    function initQuizSession() {
      const selected = document.getElementById('quiz-deck-select').value;
      let pool = [];
      if (selected === 'all') {
        pool = decks.flatMap(d => d.words.map(w => ({...w, deckId: d.id})));
      } else {
        const target = decks.find(d => d.id === selected);
        if(target) pool = target.words.map(w => ({...w, deckId: target.id}));
      }

      if (pool.length === 0) {
        document.getElementById('quiz-prompt').innerText = '無單字可測驗！';
        return;
      }

      pool.sort(() => Math.random() - 0.5);
      targetLimit = quizLimit === 0 ? pool.length : Math.min(quizLimit, pool.length);
      quizQueue = pool.slice(0, targetLimit);
      sessionResults = [];
      totalAnswered = 0;
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      if (quizQueue.length === 0) {
        endQuizSession();
        return;
      }
      document.getElementById('quiz-answer').style.display = 'block';
      document.getElementById('btn-submit-ans').style.display = 'block';
      currentQuizItem = quizQueue.shift();
      totalAnswered++;
      document.getElementById('quiz-progress').innerText = `進度：第 ${totalAnswered} / ${targetLimit} 題`;
      document.getElementById('quiz-prompt').innerText = currentQuizItem.question;
      document.getElementById('quiz-answer').value = '';
      document.getElementById('quiz-result').innerText = '';
      
      speakCurrentQuestion();
    }

    function checkAnswer() {
      if (!currentQuizItem) return;
      const userAns = document.getElementById('quiz-answer').value.trim().toLowerCase();
      const ans1 = currentQuizItem.ans1 ? currentQuizItem.ans1.trim().toLowerCase() : '';
      const ans2 = currentQuizItem.ans2 ? currentQuizItem.ans2.trim().toLowerCase() : '';
      
      const isCorrect = (userAns === ans1 || (ans2 !== '' && userAns === ans2));
      
      sessionResults.push({ deckId: currentQuizItem.deckId, correct: isCorrect });
      const deck = decks.find(d => d.id === currentQuizItem.deckId);
      if (deck) {
        const w = deck.words.find(w => w.question === currentQuizItem.question);
        if (w) {
          w.attempts = (w.attempts || 0) + 1;
          if (!isCorrect) w.errors = (w.errors || 0) + 1;
        }
      }
      saveData();

      const res = document.getElementById('quiz-result');
      if (isCorrect) {
        res.style.color = 'green'; res.innerText = '🎉 答對了！';
        setTimeout(nextQuizQuestion, 1000);
      } else {
        res.style.color = 'red'; res.innerText = `❌ 正確答案：${currentQuizItem.ans1}${currentQuizItem.ans2 ? ' / ' + currentQuizItem.ans2 : ''}`;
        setTimeout(nextQuizQuestion, 2000);
      }
    }

    function endQuizSession() {
      const correctCount = sessionResults.filter(r => r.correct).length;
      document.getElementById('quiz-progress').innerText = `📊 測驗結算`;
      document.getElementById('quiz-prompt').innerText = `恭喜完成！總題數：${totalAnswered} 題，答對：${correctCount} 題`;
      document.getElementById('quiz-answer').style.display = 'none';
      document.getElementById('btn-submit-ans').style.display = 'none';
      document.getElementById('quiz-result').innerText = '';
      
      const deckStats = {};
      sessionResults.forEach(r => {
        if (!deckStats[r.deckId]) deckStats[r.deckId] = { correct: 0, total: 0 };
        deckStats[r.deckId].total++;
        if (r.correct) deckStats[r.deckId].correct++;
      });
      for (let dId in deckStats) {
        const d = decks.find(d => d.id === dId);
        if (d) {
          d.history = d.history || [];
          d.history.push({ timestamp: Date.now(), correct: deckStats[dId].correct, total: deckStats[dId].total });
        }
      }
      saveData();
    }

    /* 統計邏輯 */
    function renderStats() {
      const selected = document.getElementById('stats-deck-select').value;
      const targetDecks = selected === 'all' ? decks : decks.filter(d => d.id === selected);
      
      let allTotal = 0, allCorrect = 0, monthTotal = 0, monthCorrect = 0;
      const now = Date.now(), oneMonthMs = 30 * 24 * 60 * 60 * 1000;
      let wordsStats = [];

      targetDecks.forEach(d => {
        (d.history || []).forEach(h => {
          allTotal += h.total;
          allCorrect += h.correct;
          if (now - h.timestamp <= oneMonthMs) {
            monthTotal += h.total;
            monthCorrect += h.correct;
          }
        });
        (d.words || []).forEach(w => {
          if (w.attempts > 0) {
            const errRate = w.errors / w.attempts;
            wordsStats.push({ ...w, deckName: d.name, errorRate: errRate });
          }
        });
      });

      const calcRate = (c, t) => t > 0 ? `<span class="${c/t >= 0.8 ? 'text-green' : (c/t < 0.5 ? 'text-red' : '')}">${Math.round((c/t)*100)}%</span> <span style="font-size:12px; font-weight:normal; color:#666;">(${c}/${t}題)</span>` : '<span style="color:#888;">尚無紀錄</span>';
      
      document.getElementById('stat-all-time').innerHTML = calcRate(allCorrect, allTotal);
      document.getElementById('stat-month').innerHTML = calcRate(monthCorrect, monthTotal);

      wordsStats.sort((a, b) => b.errorRate - a.errorRate);
      
      document.getElementById('stats-word-list').innerHTML = wordsStats.length === 0 
        ? '<p style="color:#888;">尚未有足夠的測驗紀錄。</p>' 
        : wordsStats.map(w => `
          <div class="word-item" style="display:flex; justify-content:space-between;">
            <div>
              <strong>${w.question}</strong> <span style="font-size:14px; color:#666;">(${w.ans1})</span><br>
              <span style="font-size:12px; color:#888;">📁 ${w.deckName}</span>
            </div>
            <div style="text-align:right;">
              <span class="${w.errorRate > 0.5 ? 'text-red' : (w.errorRate === 0 ? 'text-green' : '')}" style="font-weight:bold; font-size:18px;">
                ${Math.round(w.errorRate * 100)}%
              </span><br>
              <span style="font-size:12px; color:#666;">錯 ${w.errors} / 考 ${w.attempts}</span>
            </div>
          </div>
        `).join('');
    }
  </script>
</body>
</html>
